name: "Jannete"
date: "2026-08-31"
message: "Parabéns pelo texto Alan. Achei o seu blog maravilhoso e a forma com que você explica deixa tudo mais interessante. Concordo com todos os pontos abordados à respeito do ensino de informática nas escolas. Espero que todos os seus alunos vejam quanta sorte eles tem por ter um professor com seus conhecimentos e que sejam capazes de compreender a importância que tem os estudos nessa fase da vida. Tenho certeza que você será inspiração para muitos deles. Continue sempre na sua jornada de busca por novos conhecimentos. Você tem um futuro brilhante que o aguarda."
