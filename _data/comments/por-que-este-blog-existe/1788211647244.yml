name: "Mateus"
date: "2026-08-31"
message: "Professor, parabéns pelo texto — a crítica sobre como o ensino de TI é tratado como \"aula de Word\" em muitas escolas é muito precisa, e reconheci vários pontos aqui do que vivi na minha própria formação. Fiquei pensando em como isso pode se estender além da sala de aula presencial. Você mencionou que pretende documentar bastante conteúdo aqui no blog e no material didático do EMTI — pretende em algum momento estruturar isso como um curso online de verdade, com trilha de aprendizado, exercícios práticos e talvez até certificação, ou a ideia é manter mais como uma base de referência aberta, tipo uma documentação viva que qualquer aluno (ou professor de outra escola) pode consultar quando precisar? Pergunto porque acho que muita gente boa desiste de ensinar programação de forma estruturada justamente pela dificuldade de manter esse tipo de conteúdo atualizado sozinho, e queria entender melhor sua estratégia pra sustentar isso a longo prazo."
