{% comment %}Parâmetros: slug, comment_id{% endcomment %}
{% assign like_key = slug | append: '--c-' | append: comment_id %}
<button type="button" class="comment__like-btn" data-like-key="{{ like_key }}" aria-pressed="false">
  <span class="comment__like-icon" aria-hidden="true">♥</span>
  <span class="comment__like-count">–</span>
</button>

<script>
(function () {
  var scripts = document.querySelectorAll('.comment__like-btn[data-like-key="{{ like_key }}"]:not([data-bound])');
  scripts.forEach(function (btn) {
    btn.setAttribute('data-bound', '1');
    var key = btn.getAttribute('data-like-key');
    var namespace = 'alanmateus17-github-io';
    var storageKey = 'liked:' + key;
    var countEl = btn.querySelector('.comment__like-count');
    var baseUrl = 'https://counterapi.com/api/' + namespace + '/like/' + key;

    fetch(baseUrl + '?readOnly=true')
      .then(function (res) { return res.json(); })
      .then(function (data) {
        countEl.textContent = data.value || 0;
        if (localStorage.getItem(storageKey)) {
          btn.setAttribute('aria-pressed', 'true');
          btn.classList.add('is-liked');
        }
      })
      .catch(function () { countEl.textContent = '0'; });

    btn.addEventListener('click', function () {
      if (localStorage.getItem(storageKey)) return;
      btn.disabled = true;
      fetch(baseUrl)
        .then(function (res) { if (!res.ok) throw new Error('falhou'); return res.json(); })
        .then(function (data) {
          localStorage.setItem(storageKey, '1');
          btn.setAttribute('aria-pressed', 'true');
          btn.classList.add('is-liked');
          countEl.textContent = data.value || (parseInt(countEl.textContent, 10) || 0) + 1;
        })
        .catch(function () {})
        .finally(function () { btn.disabled = false; });
    });
  });
})();
</script>
