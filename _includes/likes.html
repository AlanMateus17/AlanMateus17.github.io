<div class="likes">
  <!--
    data-post-slug carrega o slug do post (só existe em tempo de build, no
    Jekyll) até o JS. A lógica de curtir de verdade mora em
    assets/js/features/likes-widget.js — aqui só passamos o dado adiante.
  -->
  <button type="button" class="likes__btn" id="like-btn" data-post-slug="{{ page.slug }}" aria-pressed="false" disabled>
    <span class="likes__icon" aria-hidden="true">♥</span>
    <span class="likes__count" id="like-count">–</span>
  </button>
  <span class="likes__label">curtidas</span>
</div>
