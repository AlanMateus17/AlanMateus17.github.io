{% assign related = site.posts | where_exp: "post", "post.categories contains page.categories[0]" | where_exp: "post", "post.url != page.url" | limit: 3 %}
{% if related.size > 0 %}
<div class="related-posts">
  <h3>Também no blog</h3>
  <ul>
    {% for post in related %}
      <li><a href="{{ post.url }}">{{ post.title }}</a></li>
    {% endfor %}
  </ul>
</div>
{% endif %}
