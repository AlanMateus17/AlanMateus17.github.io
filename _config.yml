# Configuração de blog
permalink: /blog/:year/:month/:day/:title/
paginate: 6
paginate_path: "/blog/page:num/"

# Coleções
collections:
  sistemas:
    output: true
    permalink: /portfolio/:name/

# Plugins suportados pelo GitHub Pages
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
- jekyll-feed

# Markdown
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Exclusões
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README-DEV.md
