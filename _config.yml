url: "https://AlanMateus17.github.io"
baseurl: ""
author:
  name: Alan Mateus
  github: AlanMateus17
  linkedin: alan-souza-dev
  location: Barbacena, MG — Brasil

# Status atual (atualiza aqui, aparece no site automaticamente)
status_now:
  building: "AuraPOS — sistema de PDV multi-tenant"
  studying: "Akitando #36 · Fase 0 do plano de estudos"
